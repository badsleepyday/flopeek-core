name: Build native candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact lowercase 40-character source commit.
        required: true
        type: string
      package_version:
        description: Exact package.json version at the source commit.
        required: true
        type: string
      release_channel:
        description: Channel implied by the package version.
        required: true
        type: choice
        options: [alpha, beta, rc, latest]

permissions:
  contents: read

jobs:
  preflight:
    name: Validate exact candidate identity
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      package_version: ${{ steps.identity.outputs.package_version }}
      release_channel: ${{ steps.identity.outputs.release_channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate dispatch inputs against committed package identity
        run: >-
          node scripts/verify-native-candidate.js
          --source-sha "${{ inputs.source_sha }}"
          --package-version "${{ inputs.package_version }}"
          --release-channel "${{ inputs.release_channel }}"
      - name: Require exact clean source checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ inputs.source_sha }}") { throw 'Checkout did not resolve the exact source SHA.' }
          git diff --exit-code
          git diff --cached --exit-code
          $unexpected = git status --porcelain --untracked-files=all | Where-Object { $_ -notmatch '^\?\? node_modules/' }
          if ($unexpected) { throw "Candidate source is dirty: $unexpected" }
      - id: identity
        shell: pwsh
        run: |
          "source_sha=${{ inputs.source_sha }}" >> $env:GITHUB_OUTPUT
          "package_version=${{ inputs.package_version }}" >> $env:GITHUB_OUTPUT
          "release_channel=${{ inputs.release_channel }}" >> $env:GITHUB_OUTPUT

  full-ci:
    name: Full required correctness CI
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}

  native-platforms:
    name: Build once and test ${{ matrix.package }}
    needs: [preflight, full-ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            package: '@flopeek/native-win32-x64'
            os: win32
            cpu: x64
          - runner: windows-11-arm
            package: '@flopeek/native-win32-arm64'
            os: win32
            cpu: arm64
          - runner: ubuntu-latest
            package: '@flopeek/native-linux-x64-gnu'
            os: linux
            cpu: x64
          - runner: ubuntu-24.04-arm
            package: '@flopeek/native-linux-arm64-gnu'
            os: linux
            cpu: arm64
          - runner: macos-15-intel
            package: '@flopeek/native-darwin-x64'
            os: darwin
            cpu: x64
          - runner: macos-14
            package: '@flopeek/native-darwin-arm64'
            os: darwin
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'
          cache: false
      - id: toolchain-contract
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$').Matches.Groups[1].Value
          if (-not $channel) { throw 'rust-toolchain.toml has no exact channel.' }
          "rust=$channel" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          toolchain: ${{ steps.toolchain-contract.outputs.rust }}
      - run: npm ci
      - run: npm run verify:toolchains
      - name: Test native source on the target platform
        run: cargo test --locked --manifest-path native/flopeek-core/Cargo.toml
      - name: Build candidate binary exactly once
        run: cargo build --release --locked --manifest-path native/flopeek-core/Cargo.toml
      - name: Package exact candidate binary
        shell: pwsh
        run: |
          $binary = if ('${{ matrix.os }}' -eq 'win32') { 'native/flopeek-core/target/release/flopeek-native-core.exe' } else { 'native/flopeek-core/target/release/flopeek-native-core' }
          New-Item -ItemType Directory -Force -Path candidate-platform | Out-Null
          node scripts/package-native-platform.js --package '${{ matrix.package }}' --os '${{ matrix.os }}' --cpu '${{ matrix.cpu }}' --binary $binary --output native-dist --source-sha '${{ needs.preflight.outputs.source_sha }}'
          npm pack ./native-dist --pack-destination candidate-platform
          $tarball = (Get-ChildItem candidate-platform/*.tgz | Select-Object -First 1).FullName
          node scripts/verify-clean-room-native-platform.js --platform-tarball $tarball
          $digest = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($tarball | Split-Path -Leaf)" | Set-Content "candidate-platform/checksums-${{ matrix.os }}-${{ matrix.cpu }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-candidate-platform-${{ matrix.os }}-${{ matrix.cpu }}
          path: candidate-platform/
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Measure and assemble immutable candidate
    needs: [preflight, native-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      rollout_status: ${{ steps.packet-status.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
      - name: Place generated candidate data outside the source checkout
        shell: pwsh
        run: |
          "CANDIDATE_ASSETS=${{ runner.temp }}/flopeek-native-assets" >> $env:GITHUB_ENV
          "CANDIDATE_EVIDENCE=${{ runner.temp }}/flopeek-native-evidence" >> $env:GITHUB_ENV
          "CANDIDATE_BUNDLE=${{ runner.temp }}/flopeek-native-bundle" >> $env:GITHUB_ENV
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.4'
          cache: false
      - id: toolchain-contract
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$').Matches.Groups[1].Value
          if (-not $channel) { throw 'rust-toolchain.toml has no exact channel.' }
          "rust=$channel" >> $env:GITHUB_OUTPUT
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-08-02
        with:
          toolchain: ${{ steps.toolchain-contract.outputs.rust }}
      - run: npm ci
      - run: npm run verify:toolchains
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-candidate-platform-*
          path: ${{ runner.temp }}/flopeek-native-assets
          merge-multiple: true
      - run: node scripts/verify-native-release-set.js --assets "$CANDIDATE_ASSETS"
      - name: Extract the exact Linux x64 candidate binary
        shell: bash
        run: |
          set -euo pipefail
          tarball="$CANDIDATE_ASSETS/flopeek-native-linux-x64-gnu-${{ needs.preflight.outputs.package_version }}.tgz"
          mkdir -p native/flopeek-core/target/release
          tar -xOf "$tarball" package/bin/flopeek-native-core > native/flopeek-core/target/release/flopeek-native-core
          chmod +x native/flopeek-core/target/release/flopeek-native-core
      - name: Generate candidate-bound correctness and resource evidence
        run: >-
          node scripts/run-native-candidate-evidence.js
          --binary native/flopeek-core/target/release/flopeek-native-core
          --assets "$CANDIDATE_ASSETS"
          --work-directory "${{ runner.temp }}/flopeek-native-candidate-evidence"
          --output "$CANDIDATE_EVIDENCE"
          --source-sha "${{ needs.preflight.outputs.source_sha }}"
      - name: Record explicit pending multi-day dogfood window
        shell: bash
        run: >-
          node scripts/create-native-dogfood-pending.js
          --source-revision "${{ needs.preflight.outputs.source_sha }}"
          --binary-sha256 "$(sha256sum native/flopeek-core/target/release/flopeek-native-core | awk '{print $1}')"
          --output "$CANDIDATE_EVIDENCE/native-dogfood.json"
      - name: Build complete rollout packet
        run: >-
          node scripts/build-native-rollout-evidence.js
          --candidate "$CANDIDATE_EVIDENCE/candidate.json"
          --adapter-parity "$CANDIDATE_EVIDENCE/adapter-parity.json"
          --benchmark "$CANDIDATE_EVIDENCE/benchmark.json"
          --profiles "$CANDIDATE_EVIDENCE/profiles"
          --assets "$CANDIDATE_ASSETS"
          --database-open-evidence "$CANDIDATE_EVIDENCE/database-open-evidence.json"
          --soak "$CANDIDATE_EVIDENCE/native-soak.json"
          --surface-matrix "$CANDIDATE_EVIDENCE/native-surface-matrix.json"
          --dogfood "$CANDIDATE_EVIDENCE/native-dogfood.json"
          --allow-ineligible
          --output "$CANDIDATE_EVIDENCE/native-rollout-evidence.json"
      - id: packet-status
        name: Record immutable rollout decision
        shell: pwsh
        run: |
          $packet = Get-Content "$env:CANDIDATE_EVIDENCE/native-rollout-evidence.json" -Raw | ConvertFrom-Json
          if ($packet.status -notin @('complete', 'blocked')) { throw "Unexpected rollout packet status: $($packet.status)" }
          "status=$($packet.status)" >> $env:GITHUB_OUTPUT
          Write-Host "Native rollout packet status: $($packet.status)"
          if ($packet.status -eq 'blocked') {
            Write-Host "Native default remains JavaScript; the packet retains the exact negative gate decision."
          }
      - name: Pack main package once with exact complete rollout evidence
        if: steps.packet-status.outputs.status == 'complete'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CANDIDATE_BUNDLE | Out-Null
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-rollout-evidence.json" packaging/native-rollout-evidence.json
          $pack = npm pack --json --pack-destination $env:CANDIDATE_BUNDLE | ConvertFrom-Json
          Move-Item -LiteralPath (Join-Path $env:CANDIDATE_BUNDLE $pack[0].filename) -Destination (Join-Path $env:CANDIDATE_BUNDLE 'flopeek-main.tgz')
          Copy-Item "$env:CANDIDATE_ASSETS/*.tgz" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-rollout-evidence.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/adapter-parity.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/benchmark.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/database-open-evidence.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/real-corpus.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-surface-matrix.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-soak.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-dogfood.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/test-summary.json" $env:CANDIDATE_BUNDLE
          Copy-Item -Recurse "$env:CANDIDATE_EVIDENCE/profiles" (Join-Path $env:CANDIDATE_BUNDLE 'profiles')
      - name: Build exact release manifest
        if: steps.packet-status.outputs.status == 'complete'
        run: >-
          node scripts/build-native-release-manifest.js
          --tag "v${{ needs.preflight.outputs.package_version }}"
          --main "$CANDIDATE_BUNDLE/flopeek-main.tgz"
          --rollout-evidence "$CANDIDATE_BUNDLE/native-rollout-evidence.json"
          --assets "$CANDIDATE_BUNDLE"
          --output "$CANDIDATE_BUNDLE/native-release-manifest.json"
      - name: Bind preliminary bundle to this workflow run
        if: steps.packet-status.outputs.status == 'complete'
        run: >-
          node scripts/verify-native-candidate.js
          --bundle "$CANDIDATE_BUNDLE"
          --finalize
          --source-sha "${{ needs.preflight.outputs.source_sha }}"
          --package-version "${{ needs.preflight.outputs.package_version }}"
          --release-channel "${{ needs.preflight.outputs.release_channel }}"
          --workflow-run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.packet-status.outputs.status == 'complete'
        with:
          name: native-candidate-bundle-preliminary
          path: ${{ runner.temp }}/flopeek-native-bundle/
          if-no-files-found: error
          retention-days: 30
      - name: Assemble blocked evidence bundle without release metadata
        if: steps.packet-status.outputs.status == 'blocked'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CANDIDATE_BUNDLE | Out-Null
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-rollout-evidence.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/adapter-parity.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/benchmark.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/database-open-evidence.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/real-corpus.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-surface-matrix.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-soak.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/native-dogfood.json" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_EVIDENCE/test-summary.json" $env:CANDIDATE_BUNDLE
          Copy-Item -Recurse "$env:CANDIDATE_EVIDENCE/profiles" (Join-Path $env:CANDIDATE_BUNDLE 'profiles')
          Copy-Item "$env:CANDIDATE_ASSETS/*.tgz" $env:CANDIDATE_BUNDLE
          Copy-Item "$env:CANDIDATE_ASSETS/checksums-*.txt" $env:CANDIDATE_BUNDLE
          node scripts/build-native-candidate-evidence-manifest.js --bundle "$env:CANDIDATE_BUNDLE" --source-sha "${{ needs.preflight.outputs.source_sha }}" --package-version "${{ needs.preflight.outputs.package_version }}" --workflow-run-id "${{ github.run_id }}" --output "$env:CANDIDATE_BUNDLE/native-candidate-evidence-manifest.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.packet-status.outputs.status == 'blocked'
        with:
          name: native-candidate-evidence-blocked
          path: ${{ runner.temp }}/flopeek-native-bundle/
          if-no-files-found: error
          retention-days: 30

  candidate-installs:
    name: Clean install ${{ matrix.package }}
    needs: [preflight, assemble]
    if: needs.assemble.outputs.rollout_status == 'complete'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            package: '@flopeek/native-win32-x64'
            artifact: flopeek-native-win32-x64
            os: win32
            cpu: x64
          - runner: windows-11-arm
            package: '@flopeek/native-win32-arm64'
            artifact: flopeek-native-win32-arm64
            os: win32
            cpu: arm64
          - runner: ubuntu-latest
            package: '@flopeek/native-linux-x64-gnu'
            artifact: flopeek-native-linux-x64-gnu
            os: linux
            cpu: x64
          - runner: ubuntu-24.04-arm
            package: '@flopeek/native-linux-arm64-gnu'
            artifact: flopeek-native-linux-arm64-gnu
            os: linux
            cpu: arm64
          - runner: macos-15-intel
            package: '@flopeek/native-darwin-x64'
            artifact: flopeek-native-darwin-x64
            os: darwin
            cpu: x64
          - runner: macos-14
            package: '@flopeek/native-darwin-arm64'
            artifact: flopeek-native-darwin-arm64
            os: darwin
            cpu: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-candidate-bundle-preliminary
          path: ${{ runner.temp }}/flopeek-native-bundle
      - name: Install, execute, inspect, and uninstall exact local packages
        shell: pwsh
        run: |
          $bundle = "${{ runner.temp }}/flopeek-native-bundle"
          $output = "${{ runner.temp }}/candidate-install-verification"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          node scripts/verify-native-candidate-install.js --main "$bundle/flopeek-main.tgz" --native "$bundle/${{ matrix.artifact }}-${{ needs.preflight.outputs.package_version }}.tgz" --manifest "$bundle/native-release-manifest.json" --output "$output/candidate-install-${{ matrix.os }}-${{ matrix.cpu }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-candidate-install-${{ matrix.os }}-${{ matrix.cpu }}
          path: ${{ runner.temp }}/candidate-install-verification/
          if-no-files-found: error
          retention-days: 30

  finalize:
    name: Finalize immutable candidate after six clean installs
    needs: [preflight, candidate-installs]
    if: needs.candidate-installs.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-candidate-bundle-preliminary
          path: ${{ runner.temp }}/flopeek-native-bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-candidate-install-*
          path: ${{ runner.temp }}/candidate-install-verification
          merge-multiple: true
      - name: Add all six install proofs and finalize checksums
        shell: pwsh
        run: |
          $bundle = "${{ runner.temp }}/flopeek-native-bundle"
          New-Item -ItemType Directory -Force -Path "$bundle/candidate-install-verification" | Out-Null
          Copy-Item "${{ runner.temp }}/candidate-install-verification/*.json" "$bundle/candidate-install-verification"
          node scripts/verify-native-candidate.js --bundle $bundle --finalize --require-platform-install-evidence --source-sha "${{ needs.preflight.outputs.source_sha }}" --package-version "${{ needs.preflight.outputs.package_version }}" --release-channel "${{ needs.preflight.outputs.release_channel }}" --workflow-run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-candidate-bundle
          path: ${{ runner.temp }}/flopeek-native-bundle/
          if-no-files-found: error
          retention-days: 30
